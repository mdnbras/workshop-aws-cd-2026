services:
  floci:
    image: floci/floci:latest
    container_name: workshop-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
    volumes:
      - floci-data:/app/data

  aws-cli:
    image: amazon/aws-cli:latest
    profiles: ["tools"]
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["aws", "--endpoint-url", "http://floci:4566"]

volumes:
  floci-data:
